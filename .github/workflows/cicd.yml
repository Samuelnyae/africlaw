name: CI/CD

on:
  push:
    branches: [main]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME_BOT: ${{ github.repository }}/bot-api
      IMAGE_NAME_BRAIN: ${{ github.repository }}/brain-service
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **/*.js
            **/*.ts
            **/*.tsx
            **/*.json
            **/*.md
            **/*.yml
            **/*.yaml

      - name: Lint changed files only
        if: steps.changed-files.outputs.any_changed == 'true'
        run: npm run lint:changed -- ${{ steps.changed-files.outputs.all_changed_files }}

      - name: Test
        run: npm test

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push bot-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BOT }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BOT }}:latest

      - name: Build and push brain-service
        uses: docker/build-push-action@v6
        with:
          context: ./brain-service
          file: ./brain-service/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BRAIN }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BRAIN }}:latest

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > ~/.kube/config

      - name: Deploy to Kubernetes
        run: |
          sed -i "s|ghcr.io/your-org/africlaw-bot-api:latest|${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BOT }}:${{ env.IMAGE_TAG }}|g" k8s/bot-api-deployment.yaml
          sed -i "s|ghcr.io/your-org/africlaw-brain-service:latest|${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BRAIN }}:${{ env.IMAGE_TAG }}|g" k8s/brain-service-deployment.yaml
          kubectl apply -f k8s/
