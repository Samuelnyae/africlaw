apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: africlaw-ingress
  namespace: africlaw
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - whatsapp.example.com
      secretName: africlaw-tls
  rules:
    - host: whatsapp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bot-api
                port:
                  number: 80
