apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bot-api-hpa
  namespace: africlaw
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bot-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: brain-service-hpa
  namespace: africlaw
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: brain-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
