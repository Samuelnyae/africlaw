apiVersion: v1
kind: Service
metadata:
  name: bot-api
  namespace: africlaw
  labels:
    app: bot-api
spec:
  selector:
    app: bot-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: brain-service
  namespace: africlaw
  labels:
    app: brain-service
spec:
  selector:
    app: brain-service
  ports:
    - name: http
      protocol: TCP
      port: 4000
      targetPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: africlaw
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: 6379
